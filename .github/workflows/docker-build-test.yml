name: Docker Build and Test

# Builds the unified CPU image (Dockerfile.unified: ubuntu:20.04 + protobuf 3.19.1
# from source + dipcc) and runs the pydipcc / integration / full-build checks in it.
# No registry push and no repository secrets are required.

on:
  push:
    branches: [ main, docker-experiments, cicero-modal-gpu-run ]
  pull_request:
    branches: [ main, cicero-modal-gpu-run ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.unified
          load: true
          tags: diplomacy_cicero:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DIPCC_BUILD_JOBS=4

      - name: Test pydipcc module
        run: docker run --rm diplomacy_cicero:test python /app/test_pydipcc.py

      - name: Run integration tests
        run: docker run --rm diplomacy_cicero:test python -m unittest unit_tests.test_full_integration

      - name: Run verification script
        run: docker run --rm diplomacy_cicero:test ./scripts/verify_full_build.sh
