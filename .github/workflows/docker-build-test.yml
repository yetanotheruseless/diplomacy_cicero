name: Docker Build and Test

on:
  push:
    branches: [ main, docker-experiments ]
  pull_request:
    branches: [ main ]

jobs:
  docker-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Build Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          file: Dockerfile.unified
          load: true
          tags: diplomacy_cicero:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DIPCC_BUILD_JOBS=4

      - name: Test pydipcc module
        run: docker run --rm diplomacy_cicero:test python /app/test_pydipcc.py

      - name: Run integration tests
        run: docker run --rm diplomacy_cicero:test python -m unittest unit_tests.test_full_integration

      - name: Run verification script
        run: docker run --rm diplomacy_cicero:test ./scripts/verify_full_build.sh