[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fairdiplomacy"
version = "0.1"
description = "Diplomacy Cicero and Diplodocus AI agents for the game of Diplomacy"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
dependencies = [
    "attrs==20.2.0",
    "colored==1.4.3",
    "datasets==1.18.4",
    "dacite==1.6.0",
    "ephemeral-port-reserve==1.1.4",
    "fairseq==0.10.2",
    "flask==1.1.4",
    "ipdb==0.13.9",
    "joblib==1.1.0",
    "jupyter==1.0.0",
    "matplotlib==3.5.1",
    "nose-timer==1.0.1",
    "nose==1.3.7",
    # Need to keep numpy<1.21 for numba compatibility
    "numpy>=1.20.3,<1.21.0",
    "numba==0.54.1",
    "nvidia-ml-py3==7.352.0",
    # Pin pandas to a version compatible with numpy<1.21
    "pandas>=1.3.0,<1.3.5",
    "parameterized==0.8.1",
    "pre-commit==2.17.0",
    "psutil==5.9.0",
    "pygtrie==2.4.2",
    "pytest==6.2.1",
    "pytorch-pretrained-bert==0.6.2",
    "requests==2.27.1",
    "requests_futures==1.0.0",
    "redis==4.1.4",
    "seaborn==0.11.2",
    "submitit==1.4.1",
    "tabulate==0.8.9",
    "tensorboard==2.8.0",
    "termcolor==1.1.0",
    "tokenizers==0.10.3",
    # torchtext is removed from main dependencies as it's tied to specific PyTorch versions
    "torch",
    "transformers==4.12.5",
    "tqdm==4.62.1",
    "typer==0.4.1",
    "wandb==0.12.11",
    "protobuf==3.19.1",
    "mypy-protobuf==2.10",
    "markupsafe==2.0.1",
    "pybind11>=2.10.0",
]

[project.optional-dependencies]
dev = [
    "black==19.10b0",
    "pytest==6.2.1",
    "pre-commit==2.17.0",
]
torch-extras = [
    "torchtext==0.8.1",
]

[project.scripts]
diplom = "parlai_diplomacy.scripts.diplom:main"
parlai-sweep = "parlai_diplomacy.utils.param_sweeps.collector:main"

[project.urls]
"Homepage" = "https://github.com/facebookresearch/diplomacy_cicero"
"Bug Tracker" = "https://github.com/facebookresearch/diplomacy_cicero/issues"

[tool.black]
line-length = 99
exclude = "(/(\\.eggs|\\.git|\\.mypy_cache|thirdparty|build)/|^/src)"

[tool.setuptools]
packages = ["fairdiplomacy", "parlai_diplomacy", "heyhi", "conf"]

[tool.setuptools.package-data]
"*" = ["*.pyi", "*.json"]

[tool.pytest.ini_options]
testpaths = ["unit_tests", "fairdiplomacy", "heyhi", "parlai_diplomacy"]