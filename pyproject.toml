[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fairdiplomacy"
version = "0.2.0"
description = "Diplomacy Cicero and Diplodocus AI agents for the game of Diplomacy"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
dependencies = [
    "attrs>=25.3,<26",
    "colored>=2.3,<3",
    "dacite>=1.9,<2",
    "ephemeral-port-reserve>=1.1.4,<2",
    "joblib>=1.5,<2",
    "numpy==2.4.6",
    "protobuf==7.35.1",
    "psutil>=7,<8",
    "pybind11==3.0.4",
    "pygtrie>=2.5,<3",
    "python-dateutil>=2.9,<3",
    "pyyaml>=6,<7",
    "requests>=2.32,<3",
    "submitit>=1.5,<2",
    "tabulate>=0.9,<0.10",
    "termcolor>=3.1,<4",
    "torch==2.13.0",
    "tqdm>=4.67,<5",
]

[project.optional-dependencies]
build = [
    "mypy-protobuf==5.1.0",
    "scikit-build-core==1.0.3",
]
dialogue = [
    "emoji>=2.14,<3",
    "ftfy>=6.3,<7",
    "iopath>=0.1.10,<0.2",
    "jsonlines>=4,<5",
    "nltk>=3.10,<4",
    "pillow>=12.3,<13",
    "pyarrow>=25,<26",
    "regex>=2026.1",
    "scikit-learn>=1.8,<2",
    "sentencepiece>=0.2,<0.3",
    "sh>=2.4,<3",
    "subword-nmt>=0.3.8,<0.4",
    "tokenizers>=0.23,<0.24",
    "unidecode>=1.4,<2",
    "websocket-client>=1.9,<2",
]
dev = [
    "parameterized>=0.9,<0.10",
    "pre-commit>=4.3,<5",
    "pytest>=9,<10",
    "ruff>=0.12,<1",
]
training = [
    "nvidia-ml-py>=13.580",
    "pandas>=2.3,<3",
    "pyzmq>=27.1,<28",
    "redis>=6,<7",
    "tensorboard>=2.20,<3",
    "wandb>=0.21,<1",
]

[project.scripts]
diplom = "parlai_diplomacy.scripts.diplom:main"
parlai-sweep = "parlai_diplomacy.utils.param_sweeps.collector:main"

[project.urls]
"Homepage" = "https://github.com/facebookresearch/diplomacy_cicero"
"Bug Tracker" = "https://github.com/facebookresearch/diplomacy_cicero/issues"

[tool.black]
line-length = 99
exclude = "(/(\\.eggs|\\.git|\\.mypy_cache|thirdparty|build)/|^/src)"

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.setuptools.packages.find]
include = [
    "conf*",
    "fairdiplomacy*",
    "heyhi*",
    "nest*",
    "parlai_diplomacy*",
]

[tool.setuptools.package-data]
"*" = ["*.pyi", "*.json"]

[tool.pytest.ini_options]
testpaths = ["unit_tests", "fairdiplomacy", "heyhi", "parlai_diplomacy"]
