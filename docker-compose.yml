services:
  # Main service using the unified Dockerfile
  diplomacy:
    build:
      context: .
      dockerfile: Dockerfile.unified
      args:
        # Can be adjusted based on available memory
        DIPCC_BUILD_JOBS: 2
    volumes:
      # Mount your local code to allow for development
      - .:/app
      # Mount a volume for model files (which are downloaded separately)
      - diplomacy_models:/app/models
    # Keep the container running
    stdin_open: true
    tty: true
    # Environment variables
    environment:
      - PYTHONPATH=/app
  
  # Lighter version for testing only
  diplomacy_test:
    build:
      context: .
      dockerfile: Dockerfile.unified
      target: test
    volumes:
      - .:/app
    # Command to run tests
    command: python /app/test_pydipcc.py

volumes:
  diplomacy_models:
    # Persistent volume for downloaded model files