services:
  # Main service using the unified Dockerfile
  diplomacy:
    build:
      context: .
      dockerfile: Dockerfile.unified
      args:
        # Reduced to avoid memory issues
        DIPCC_BUILD_JOBS: 1
    volumes:
      # Mount your local code to allow for development
      - .:/app
      # Mount a volume for model files (which are downloaded separately)
      - diplomacy_models:/app/models
    # Keep the container running
    stdin_open: true
    tty: true
    # Allocate more memory to the container
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    # Environment variables
    environment:
      - PYTHONPATH=/app
  
  # Service for running tests
  diplomacy_test:
    build:
      context: .
      dockerfile: Dockerfile.unified
    volumes:
      - .:/app
    # Command to run tests
    command: python /app/test_pydipcc.py

volumes:
  diplomacy_models:
    # Persistent volume for downloaded model files