x-modern-build-args: &modern-build-args
  UBUNTU_VERSION: "24.04"
  PYTHON_VERSION: "3.12"
  TORCH_VERSION: "2.13.0"
  PROTOC_VERSION: "35.1"
  CUDA_VERSION: "13.0.3"

x-cpu-build: &cpu-build
  context: .
  dockerfile: Dockerfile
  target: cpu-build
  args: *modern-build-args

x-common-environment: &common-environment
  PYTHONPATH: /app
  PYTHONUNBUFFERED: "1"

services:
  diplomacy:
    image: diplomacy-cicero:cpu
    build: *cpu-build
    init: true
    stdin_open: true
    tty: true
    environment: *common-environment
    volumes:
      - diplomacy_models:/app/models

  diplomacy_test:
    profiles: [test]
    image: diplomacy-cicero:cpu
    build: *cpu-build
    init: true
    environment: *common-environment
    command: ["./scripts/verify_full_build.sh", "--accelerator", "cpu"]

  diplomacy_cuda:
    profiles: [cuda]
    image: diplomacy-cicero:cuda
    build:
      context: .
      dockerfile: Dockerfile
      target: cuda-runtime
      args: *modern-build-args
    init: true
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment: *common-environment
    volumes:
      - diplomacy_models:/app/models

volumes:
  diplomacy_models:
